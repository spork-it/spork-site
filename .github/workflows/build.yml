name: Build and Publish Distributions

on:
  push:
    tags:
      - "v*"

jobs:
  full_tests:
    name: Run full pre-release test suite
    uses: ./.github/workflows/test.yml
    with:
      full: true

  build:
    name: Build universal distributions
    needs: full_tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up minimum supported Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "spork-lang==0.6.0" twine

      - name: Verify tag and manifest versions match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from spork.project.config import ProjectConfig

          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          project_version = ProjectConfig.load().version
          if tag_version != project_version:
              raise SystemExit(
                  f"tag version {tag_version!r} does not match manifest {project_version!r}"
              )
          PY

      - name: Build wheel and source distribution
        run: python -m spork dist --clean

      - name: Check distributions
        run: |
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*-py3-none-any.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Verify wheel payload and dependencies
        run: |
          python - <<'PY'
          from configparser import ConfigParser
          from email import message_from_bytes
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name

          wheel = next(Path("dist").glob("*.whl"))
          modules = {path.stem for path in Path("src/spork_site").glob("*.spork")}
          required = {"spork_site/__init__.py"}
          for module in modules:
              required.update(
                  {
                      f"spork_site/{module}.py",
                      f"spork_site/{module}.spork",
                      f"spork_site/{module}.spork.map.json",
                  }
              )

          with ZipFile(wheel) as archive:
              names = archive.namelist()
              missing = required.difference(names)
              metadata_name = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              entry_points_name = next(
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              )
              metadata = message_from_bytes(archive.read(metadata_name))
              entry_points = ConfigParser()
              entry_points.read_string(archive.read(entry_points_name).decode("utf-8"))

          if missing:
              raise SystemExit(f"wheel is missing: {sorted(missing)}")
          if dict(entry_points["spork.commands.v1"]) != {
              "site": "spork_site.cli:command"
          }:
              raise SystemExit(
                  f"unexpected command entry points: {dict(entry_points['spork.commands.v1'])}"
              )

          dependency_names = {
              canonicalize_name(Requirement(value).name)
              for value in metadata.get_all("Requires-Dist", [])
          }
          expected = {
              canonicalize_name(name)
              for name in (
                  "spork-runtime",
                  "markdown-it-py",
                  "python-frontmatter",
                  "Pygments",
                  "watchfiles",
              )
          }
          if not expected.issubset(dependency_names):
              raise SystemExit(
                  f"wheel dependencies {sorted(dependency_names)} do not include "
                  f"{sorted(expected)}"
              )
          if "spork-lang" in dependency_names:
              raise SystemExit("wheel must not require the spork-lang compiler")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: ./dist/*

  test_wheel:
    name: Test wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Disable the GIL for free-threaded Python
        if: endsWith(matrix.python-version, 't')
        run: echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Verify runtime-only dependency installation
        run: |
          python - <<'PY'
          from importlib.metadata import PackageNotFoundError, version

          assert version("spork-runtime")
          assert version("markdown-it-py")
          assert version("python-frontmatter")
          assert version("Pygments")
          assert version("watchfiles")
          try:
              version("spork-lang")
          except PackageNotFoundError:
              pass
          else:
              raise SystemExit("spork-site unexpectedly installed spork-lang")
          PY

      - name: Smoke-test Python API outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from spork.runtime.types import Keyword
          from spork_site.content import parse_front_matter
          from spork_site.markdown import render
          from spork_site.nodes import Element, Fragment
          from spork_site.render import render_html

          parsed = parse_front_matter("---\ntitle: Hello\n---\nBody\n")
          assert parsed[Keyword("metadata")][Keyword("title")] == "Hello"
          document = render("# Hello\n\nBuilt with **Spork**.\n")
          assert isinstance(document, Fragment)
          assert isinstance(document.children[0], Element)
          assert render_html(document) == (
              "<h1>Hello</h1><p>Built with <strong>Spork</strong>.</p>"
          )
          PY

      - name: Install Spork
        run: python -m pip install "spork-lang==0.6.0"

      - name: Smoke-test installed command provider
        working-directory: ${{ runner.temp }}
        run: |
          python -m spork site version
          python -m spork site --help

      - name: Smoke-test installed Spork source discovery
        working-directory: ${{ runner.temp }}
        env:
          PYTHONIOENCODING: utf-8
        run: >-
          python -m spork -c '(ns release-smoke
          (:require [spork-site.core :as site :refer [element fragment markup]]))
          (def page (markup ($main ($h1 "Hello") (site.render-markdown "**Spork**"))))
          (assert (= (site.render-html page)
          "<main><h1>Hello</h1><p><strong>Spork</strong></p></main>"))'

  test_sdist:
    name: Test source distribution
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Build and install from sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz

      - name: Smoke-test installed sdist
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "from spork_site.content import parse_front_matter;
          from spork_site.markdown import render;
          from spork_site.render import render_html;
          assert render_html(render('Hello')) == '<p>Hello</p>';
          assert 'Body' in str(parse_front_matter('Body'))"

  publish:
    name: Publish to PyPI
    needs: [build, test_wheel, test_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spork-site
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Create GitHub Release
    needs: [build, test_wheel, test_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
